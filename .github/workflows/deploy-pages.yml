name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/glassmorphism-ui
    paths:
      - 'website/**'
      - 'VERSION'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Installer Scripts for Website
        run: |
          if [ -f install.ps1 ]; then
            cp install.ps1 website/install.ps1
            mkdir -p website/downloads
            cp install.ps1 website/downloads/install.ps1
          fi

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
          commit_message: "chore(deploy): auto-deploy website from commit ${{ github.sha }} [skip ci]"
