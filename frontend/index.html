<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVR/NVR Forensic Analysis Tool — SIH26150 (NTRO)</title>
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body class="dark-theme">
  <div id="app-container" class="app-container">
    <!-- Header component rendered here -->
    <header id="header-root" class="header-root"></header>

    <!-- Breadcrumb strip — rendered by renderHeader() -->
    <nav id="breadcrumb-strip" class="breadcrumb-strip"></nav>

    <div class="main-layout">
      <!-- Sidebar navigation -->
      <aside id="sidebar-root" class="sidebar-root"></aside>

      <!-- Content view area -->
      <main id="content-root" class="content-root"></main>
    </div>
  </div>

  <!-- Modal root -->
  <div id="modal-root"></div>

  <!-- Scripts. The ?v= query string is a manual cache-buster: bump it on any
       frontend change so browsers can't serve a stale cached copy of these
       files (this app previously had no Cache-Control header at all, which
       let some browsers cache these indefinitely without ever re-checking). -->
  <script src="/js/api.js?v=3"></script>
  <script src="/js/components/Header.js?v=3"></script>
  <script src="/js/components/Sidebar.js?v=3"></script>
  <script src="/js/components/Modal.js?v=3"></script>
  <script src="/js/screens/DashboardScreen.js?v=3"></script>
  <script src="/js/screens/NewCaseScreen.js?v=3"></script>
  <script src="/js/screens/CaseDetailScreen.js?v=3"></script>
  <script src="/js/screens/EvidenceScanScreen.js?v=3"></script>
  <script src="/js/screens/RecordingsScreen.js?v=3"></script>
  <script src="/js/screens/TimelineScreen.js?v=3"></script>
  <script src="/js/screens/AuditLogScreen.js?v=3"></script>
  <script src="/js/screens/ExportReportScreen.js?v=3"></script>
  <script src="/js/screens/LoginScreen.js?v=3"></script>
  <script src="/js/app.js?v=3"></script>
</body>
</html>
